<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur" />
      <feOffset in="blur" dx="0" dy="18" result="offsetBlur" />
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.30" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)" />
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#topHighlight)" />

  <!-- glyph: a response card — two answered rows, one still waiting -->
  <g filter="url(#shadow)">
    <rect x="252" y="222" width="520" height="580" rx="64" ry="64" fill="#ffffff" />

    <!-- answered -->
    <path d="M334,368 l38,38 l70,-72" fill="none" stroke="#6d28d9" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="486" y="356" width="204" height="40" rx="20" fill="#6d28d9" fill-opacity="0.34" />

    <!-- answered -->
    <path d="M334,512 l38,38 l70,-72" fill="none" stroke="#6d28d9" stroke-width="42"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="486" y="500" width="204" height="40" rx="20" fill="#6d28d9" fill-opacity="0.34" />

    <!-- waiting -->
    <circle cx="368" cy="668" r="40" fill="none" stroke="#6d28d9" stroke-width="34" stroke-opacity="0.55" />
    <rect x="486" y="648" width="134" height="40" rx="20" fill="#6d28d9" fill-opacity="0.18" />
  </g>
</svg>
